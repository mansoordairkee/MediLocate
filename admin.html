<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLocate - Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-page">
    <div class="container admin-container">
        <div class="admin-header">
            <div class="header-left">
                <div class="admin-icon">
                    <i data-lucide="shield"></i>
                </div>
                <h1 class="admin-title">Admin Dashboard</h1>
            </div>
            <button class="btn btn-outline" onclick="signOut()">
                <i data-lucide="log-out"></i>
                Sign Out
            </button>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Welcome, Admin</h2>
                <p class="card-description">Logged in as: admin@medilocate.com</p>
            </div>
            <div class="card-content">
                <div class="status-box">
                    <h3 class="status-title">System Status</h3>
                    <p class="status-text">All systems operational</p>
                </div>

                <div class="grid stats-grid-admin">
                    <div class="card stat-card">
                        <h3 class="stat-card-title">Users</h3>
                        <p class="stat-value stat-primary">-</p>
                    </div>

                    <div class="card stat-card">
                        <h3 class="stat-card-title">Services</h3>
                        <p class="stat-value stat-primary">-</p>
                    </div>

                    <div class="card stat-card">
                        <h3 class="stat-card-title">Active Sessions</h3>
                        <p class="stat-value stat-primary">1</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function signOut() {
            window.location.href = 'auth.html';
        }

        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
