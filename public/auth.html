<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLocate - Authentication</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="card auth-card">
            <div class="card-header">
                <h1 class="card-title">Welcome to MediLocate</h1>
                <p class="card-description">Sign in or create an account to continue</p>
            </div>
            <div class="card-content">
                <div class="tabs">
                    <div class="tabs-list">
                        <button class="tabs-trigger active" onclick="switchTab('signin')" data-testid="tab-signin">
                            Sign In
                        </button>
                        <button class="tabs-trigger" onclick="switchTab('signup')" data-testid="tab-signup">
                            Sign Up
                        </button>
                    </div>

                    <!-- Sign In Form -->
                    <div class="tabs-content active" id="signin">
                        <form class="form" onsubmit="handleSignIn(event)">
                            <div class="form-group">
                                <label class="label" for="signin-email">Email</label>
                                <input class="input" id="signin-email" type="email" placeholder="your@email.com"
                                    required data-testid="input-signin-email" />
                            </div>
                            <div class="form-group">
                                <label class="label" for="signin-password">Password</label>
                                <input class="input" id="signin-password" type="password" placeholder="••••••••"
                                    required data-testid="input-signin-password" />
                            </div>
                            <button class="btn btn-primary btn-full" type="submit" data-testid="button-signin-submit">
                                Sign In
                            </button>
                        </form>
                    </div>

                    <!-- Sign Up Form -->
                    <div class="tabs-content" id="signup">
                        <form class="form" onsubmit="handleSignUp(event)">
                            <div class="form-group">
                                <label class="label" for="signup-email">Email</label>
                                <input class="input" id="signup-email" type="email" placeholder="your@email.com"
                                    required data-testid="input-signup-email" />
                            </div>
                            <div class="form-group">
                                <label class="label" for="signup-password">Password</label>
                                <input class="input" id="signup-password" type="password" placeholder="••••••••"
                                    required minlength="6" data-testid="input-signup-password" />
                            </div>
                            <button class="btn btn-primary btn-full" type="submit" data-testid="button-signup-submit">
                                Sign Up
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <div class="toast-title" id="toast-title"></div>
        <div class="toast-description" id="toast-description"></div>
    </div>

    <script>
        const ADMIN_API = "https://medilocate-pjfg.onrender.com/api/auth/admin"
        const USER_API = "https://medilocate-pjfg.onrender.com/api/auth"
        function switchTab(tabId) {
            // Remove active class from all triggers and contents
            document.querySelectorAll('.tabs-trigger').forEach(trigger => {
                trigger.classList.remove('active');
            });
            document.querySelectorAll('.tabs-content').forEach(content => {
                content.classList.remove('active');
            });

            // Add active class to selected trigger and content
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function showToast(title, description, isError = false) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastDescription = document.getElementById('toast-description');

            toastTitle.textContent = title;
            toastDescription.textContent = description;

            toast.classList.remove('error');
            if (isError) {
                toast.classList.add('error');
            }

            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        async function handleSignUp(event) {

            event.preventDefault();

            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            try {

                const response = await fetch(`${USER_API}/signup`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: email.split("@")[0],
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showToast("Error", data.error, true);
                    return;
                }

                // Store token
                localStorage.setItem("token", data.token);
                localStorage.setItem("role", "user");

                showToast("Success", "Account created successfully");

                setTimeout(() => {
                    window.location.href = "main.html";
                }, 1000);

            } catch (error) {
                showToast("Error", "Server not responding", true);
            }
        }

        // Admin Signup Function
        async function adminSignup(name, email, password, adminKey) {
            try {
                const response = await fetch(`${ADMIN_API}/signup`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        password,
                        adminKey
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.error);
                } else {
                    alert("Admin created successfully!");
                }

            } catch (error) {
                console.error(error);
                alert("Error creating admin");
            }
        }

        async function handleSignIn(event) {

            event.preventDefault();

            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;

            try {

                // Try Admin Login First
                let response = await fetch(`${ADMIN_API}/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                let data = await response.json();

                if (response.ok) {

                    localStorage.setItem("token", data.token);
                    localStorage.setItem("role", "admin");

                    showToast("Success", "Admin login successful");

                    setTimeout(() => {
                        window.location.href = "admin.html";
                    }, 1000);

                    return;
                }

                // Try User Login
                response = await fetch(`${USER_API}/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                data = await response.json();

                if (!response.ok) {
                    showToast("Error", data.error, true);
                    return;
                }

                localStorage.setItem("token", data.token);
                localStorage.setItem("role", "user");

                showToast("Success", "User login successful");

                setTimeout(() => {
                    window.location.href = "main.html";
                }, 1000);

            } catch (error) {

                showToast("Error", "Server not responding", true);
            }
        }

        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>

</html>
