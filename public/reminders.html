<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLocate - Reminders</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon"><i data-lucide="heart"></i></div>
                    <div class="logo-text">
                        <h1>MediLocate</h1>
                        <p>Reminders</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-outline" onclick="window.location.href='symptom-checker.html'">
                        <i data-lucide="activity"></i>
                        <span class="desktop-text">Symptom Checker</span>
                    </button>
                    <button class="btn btn-emergency" onclick="if(confirm('Call 105?'))window.open('tel:105')">
                        <i data-lucide="phone"></i>
                        <span class="desktop-text">Emergency: 105</span>
                        <span class="mobile-text">105</span>
                    </button>
                    <button class="btn btn-outline" onclick="window.location.href='index.html'">
                        <i data-lucide="arrow-left"></i>
                        <span class="desktop-text">Back to Map</span>
                    </button>
                    <button class="btn btn-outline" onclick="logout()">
                        <i data-lucide="log-out"></i>
                        <span class="desktop-text">Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">

            <!-- Page header -->
            <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;">
                <div>
                    <h2 class="page-title">Your Reminders</h2>
                    <p class="page-subtitle" style="margin-bottom:0;">Upcoming appointments and monthly health checkups</p>
                </div>
                <button class="btn btn-primary" onclick="window.location.href='index.html'">
                    <i data-lucide="calendar-plus"></i>
                    Book New Appointment
                </button>
            </div>

            <!-- Stats row -->
            <div class="stats-grid" style="margin-bottom:1.5rem;" id="statsRow"></div>

            <!-- Tabs -->
            <div class="reminders-tabs">
                <button class="rem-tab active" onclick="switchTab('appointments', this)">
                    &#128197; Appointments
                    <span id="apptCountBadge" style="margin-left:6px;background:var(--primary);color:white;font-size:0.65rem;padding:1px 7px;border-radius:9999px;"></span>
                </button>
                <button class="rem-tab" onclick="switchTab('checkups', this)">
                    &#129657; Monthly Checkups
                </button>
                <button class="rem-tab" onclick="switchTab('past', this)">
                    &#128336; Past Appointments
                </button>
            </div>

            <!-- Appointments panel -->
            <div class="rem-panel active" id="panel-appointments">
                <div id="appointmentsList"></div>
            </div>

            <!-- Checkups panel -->
            <div class="rem-panel" id="panel-checkups">
                <div id="checkupsList"></div>
            </div>

            <!-- Past panel -->
            <div class="rem-panel" id="panel-past">
                <div id="pastList"></div>
            </div>

        </div>
    </main>

    <!-- Cancel confirm modal -->
    <div class="modal-overlay hidden" id="cancelModal">
        <div class="modal-box">
            <div class="modal-icon" style="background:hsla(0,84%,60%,0.1);color:var(--destructive);">
                <i data-lucide="trash-2"></i>
            </div>
            <h3 class="modal-title">Cancel Appointment?</h3>
            <p class="modal-desc">Are you sure you want to cancel this appointment? This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="document.getElementById('cancelModal').classList.add('hidden')">
                    Keep It
                </button>
                <button class="btn btn-emergency" id="confirmCancelBtn">
                    Yes, Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <div class="toast-title" id="toast-title"></div>
        <div class="toast-description" id="toast-description"></div>
    </div>

    <script>
        lucide.createIcons();

        const MONTHLY_CHECKUPS = [
            { id: 'c1', name: 'Blood Pressure Check',       icon: 'activity',        color: '#ef4444', freq: 'Every Month',   lastDone: offsetDate(-20), nextDue: offsetDate(10),  status: 'due-soon' },
            { id: 'c2', name: 'Blood Sugar (Fasting)',       icon: 'droplets',        color: '#f59e0b', freq: 'Every Month',   lastDone: offsetDate(-35), nextDue: offsetDate(-5),  status: 'overdue'  },
            { id: 'c3', name: 'Complete Blood Count (CBC)',  icon: 'test-tube',       color: '#3b82f6', freq: 'Every 3 Months',lastDone: offsetDate(-60), nextDue: offsetDate(30),  status: 'on-track' },
            { id: 'c4', name: 'Cholesterol Panel',           icon: 'heart-pulse',     color: '#8b5cf6', freq: 'Every 6 Months',lastDone: offsetDate(-90), nextDue: offsetDate(90),  status: 'on-track' },
            { id: 'c5', name: 'Eye Examination',             icon: 'eye',             color: '#06b6d4', freq: 'Every 6 Months',lastDone: offsetDate(-45), nextDue: offsetDate(135), status: 'on-track' },
            { id: 'c6', name: 'Dental Checkup',              icon: 'smile',           color: '#10b981', freq: 'Every 6 Months',lastDone: offsetDate(-15), nextDue: offsetDate(165), status: 'on-track' },
            { id: 'c7', name: 'Thyroid Function Test (TSH)', icon: 'zap',             color: '#f97316', freq: 'Every Year',    lastDone: offsetDate(-200),nextDue: offsetDate(165), status: 'on-track' },
            { id: 'c8', name: 'Urine Routine & Microscopy',  icon: 'flask-conical',   color: '#14b8a6', freq: 'Every Month',   lastDone: offsetDate(-28), nextDue: offsetDate(2),   status: 'due-soon' },
        ];

        function offsetDate(days) {
            const d = new Date();
            d.setDate(d.getDate() + days);
            return d.toISOString().split('T')[0];
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function getDay(dateStr)   { return new Date(dateStr + 'T00:00:00').getDate(); }
        function getMonth(dateStr) { return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-IN', { month: 'short' }); }

        function isUpcoming(dateStr) {
            return new Date(dateStr + 'T23:59:59') >= new Date();
        }

        function isToday(dateStr) {
            return dateStr === new Date().toISOString().split('T')[0];
        }

        function getAppointments() {
            return JSON.parse(localStorage.getItem('medilocate_appointments') || '[]');
        }

        function deleteAppointment(id) {
            const all = getAppointments().filter(a => a.id !== id);
            localStorage.setItem('medilocate_appointments', JSON.stringify(all));
            renderAll();
            showToast('Cancelled', 'Appointment has been cancelled.', false);
            document.getElementById('cancelModal').classList.add('hidden');
        }

        let pendingCancelId = null;
        function confirmCancel(id) {
            pendingCancelId = id;
            document.getElementById('cancelModal').classList.remove('hidden');
            lucide.createIcons();
        }
        document.getElementById('confirmCancelBtn').onclick = () => {
            if (pendingCancelId) deleteAppointment(pendingCancelId);
        };

        function switchTab(tabId, btn) {
            document.querySelectorAll('.rem-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.rem-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('panel-' + tabId).classList.add('active');
        }

        function renderStats(upcoming, past) {
            const overdue = MONTHLY_CHECKUPS.filter(c => c.status === 'overdue').length;
            const dueSoon = MONTHLY_CHECKUPS.filter(c => c.status === 'due-soon').length;
            document.getElementById('statsRow').innerHTML = `
                <div class="card stat-card">
                    <div class="stat-value stat-primary">${upcoming}</div>
                    <div class="stat-label">Upcoming Appointments</div>
                </div>
                <div class="card stat-card">
                    <div class="stat-value stat-success">${MONTHLY_CHECKUPS.length}</div>
                    <div class="stat-label">Health Checkup Tasks</div>
                </div>
                <div class="card stat-card">
                    <div class="stat-value stat-destructive">${overdue}</div>
                    <div class="stat-label">Overdue Checkups</div>
                </div>
                <div class="card stat-card">
                    <div class="stat-value stat-purple">${dueSoon}</div>
                    <div class="stat-label">Due Soon</div>
                </div>`;
        }

        function renderAppointments(list, containerId, emptyMsg) {
            const container = document.getElementById(containerId);
            if (list.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i data-lucide="calendar-x" style="width:48px;height:48px;display:block;margin:0 auto 1rem;opacity:0.25;"></i>
                        <p>${emptyMsg}</p>
                        ${containerId === 'appointmentsList' ? '<p style="margin-top:0.5rem;"><a href="index.html" style="color:var(--primary);">Find a hospital and book one</a></p>' : ''}
                    </div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = list.map(appt => {
                const today = isToday(appt.date);
                const badge = today ? '<span class="appt-badge today">Today</span>' : '<span class="appt-badge upcoming">Upcoming</span>';
                const cancelBtn = isUpcoming(appt.date)
                    ? `<button class="btn btn-outline" style="font-size:0.75rem;padding:0.35rem 0.75rem;color:var(--destructive);border-color:var(--destructive);" onclick="confirmCancel('${appt.id}')"><i data-lucide="x"></i> Cancel</button>`
                    : '';
                return `
                <div class="appt-card">
                    <div class="appt-card-left">
                        <div class="appt-date-box">
                            <span class="day">${getDay(appt.date)}</span>
                            <span class="month">${getMonth(appt.date)}</span>
                        </div>
                        <div class="appt-info">
                            <h4>${appt.hospitalName}</h4>
                            <p>${appt.doctorName} &mdash; ${appt.specialty}</p>
                            <div class="appt-meta">
                                <span>&#128337; ${appt.slot}</span>
                                <span>&#128100; ${appt.patientName}</span>
                                ${appt.reason ? `<span>&#128203; ${appt.reason.substring(0,40)}${appt.reason.length>40?'…':''}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.5rem;">
                        ${badge}
                        ${cancelBtn}
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        function renderCheckups() {
            const container = document.getElementById('checkupsList');
            container.innerHTML = `
                <p style="font-size:0.8rem;color:var(--muted-foreground);margin-bottom:1rem;">
                    Your recommended monthly health checkup schedule. Stay on top of your health!
                </p>` +
                MONTHLY_CHECKUPS.map(c => {
                    const statusLabel = c.status === 'overdue' ? 'Overdue' : c.status === 'due-soon' ? 'Due Soon' : 'On Track';
                    return `
                    <div class="checkup-card">
                        <div class="checkup-icon" style="background:${c.color}18;color:${c.color};">
                            <i data-lucide="${c.icon}"></i>
                        </div>
                        <div class="checkup-info">
                            <h4>${c.name}</h4>
                            <p>${c.freq} &nbsp;|&nbsp; Last done: ${formatDate(c.lastDone)} &nbsp;|&nbsp; Next due: ${formatDate(c.nextDue)}</p>
                        </div>
                        <div class="checkup-due ${c.status}">${statusLabel}</div>
                    </div>`;
                }).join('');
            lucide.createIcons();
        }

        function renderAll() {
            const all  = getAppointments();
            const upcoming = all.filter(a => isUpcoming(a.date)).sort((a,b) => a.date.localeCompare(b.date));
            const past     = all.filter(a => !isUpcoming(a.date)).sort((a,b) => b.date.localeCompare(a.date));

            renderStats(upcoming.length, past.length);
            renderAppointments(upcoming, 'appointmentsList', 'No upcoming appointments.');
            renderAppointments(past,     'pastList',         'No past appointments yet.');
            renderCheckups();

            const badge = document.getElementById('apptCountBadge');
            badge.textContent = upcoming.length > 0 ? upcoming.length : '';
            badge.style.display = upcoming.length > 0 ? 'inline' : 'none';
        }

        function logout() { window.location.href = 'auth.html'; }

        function showToast(title, desc, isError) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-description').textContent = desc;
            toast.classList.toggle('error', !!isError);
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        renderAll();
    </script>
</body>
</html>
